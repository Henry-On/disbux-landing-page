<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found - Disbux</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" sizes="64x64" href="/images/favicon.png">
    <link rel="shortcut icon" href="/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 24px;
            background-color: #0d0a22;
            background-image:
                radial-gradient(ellipse 75% 60% at 18% 15%, rgba(60, 63, 157, 0.55), transparent 62%),
                radial-gradient(ellipse 65% 55% at 85% 80%, rgba(144, 13, 140, 0.42), transparent 62%),
                linear-gradient(180deg, #171334, #0d0a22);
        }

        .wrap {
            max-width: 460px;
        }

        .logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            margin-bottom: 28px;
            box-shadow: 0 0 40px rgba(144, 13, 140, 0.55), 0 0 80px rgba(60, 63, 157, 0.5);
        }

        .code {
            font-size: 88px;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(90deg, #8b8ef7, #e561e0);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: rgba(255, 255, 255, 0.75);
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 13px 36px;
            border-radius: 999px;
            background: white;
            color: #3C3F9D;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 12px 26px -10px rgba(0, 0, 0, 0.45);
            transition: transform 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px);
        }
    </style>
</head>

<body>
    <div class="wrap">
        <img class="logo" src="/images/logo-square.png" alt="Disbux logo">
        <div class="code">404</div>
        <h1>This page could not be found</h1>
        <p>The code you followed doesn't lead anywhere — but your money always will. Let's get you back home.</p>
        <a class="btn" href="/">Back to Disbux</a>
    </div>
</body>

</html>
